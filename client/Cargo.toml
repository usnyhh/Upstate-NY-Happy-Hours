[package]
name = "client"
version = "0.1.0"
edition = "2024"

# Builds for two targets from the same `app.rs`:
#   * web     — `trunk serve` / `trunk build` (wasm32-unknown-unknown)
#   * desktop — `cargo run` (native, X11 + Wayland on Linux)

[dependencies]
# Default features: wgpu + tiny-skia (software fallback) renderers, X11 + Wayland.
iced = "0.14"
# The API is plain HTTP on localhost. TLS is only needed for the HTTPS
# IP-geolocation lookup (src/geolocate.rs): `rustls` is enabled for native below;
# on wasm the browser's fetch handles TLS.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Render through WebGL so the app also works in browsers without WebGPU.
iced = { version = "0.14", features = ["webgl"] }
console_log = "1"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# reqwest needs a tokio runtime on native; this makes iced's executor tokio.
iced = { version = "0.14", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true

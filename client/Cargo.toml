[package]
name = "client"
version = "0.1.0"
edition = "2024"

# Builds for two targets from the same code (`ui/app.slint` + `src/`):
#   * web     — `trunk serve` / `trunk build` (wasm32-unknown-unknown)
#   * desktop — `cargo run` (native, X11 + Wayland on Linux)

[dependencies]
# winit backend (X11 + Wayland on Linux, a <canvas> on the web), rendered with
# femtovg (OpenGL / WebGL), with the software renderer as a fallback. Slint's
# default `system-tray` feature is left out; nothing here uses it.
slint = { version = "1.19", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
# The API is plain HTTP on localhost. TLS is only needed for the HTTPS
# IP-geolocation lookup (src/geolocate.rs): `rustls` is enabled for native below;
# on wasm the browser's fetch handles TLS.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# To size the app to the browser window and follow its resizes (src/main.rs).
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "EventTarget"] }
console_log = "1"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# reqwest needs a tokio runtime on native, but futures run on Slint's event
# loop; async-compat runs them inside a (lazily started) tokio context.
async-compat = "0.2"
env_logger = "0.11"

[profile.release]
opt-level = 2
lto = true
